<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Haven</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .content {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            margin-top: 0;
            color: #333;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>Welcome to Animal Haven</h1>
        <p>I love all animals! Check out some of my favourites below.</p>
        <img src="image_0.png" alt="A beautiful, vibrant full-color photograph showing four animals peacefully coexisting in a lush natural habitat: a Golden Retriever puppy, a tortoiseshell cat, a Giant Panda, and a young African Elephant. The scene features trees, grass, bamboo, rolling hills, and a river under a bright blue sky.">
    </div>
</body>
</html>
